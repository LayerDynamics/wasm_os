/* TinyEMU VM configuration for WASM_OS (Linux guest integration, RISC-V).
 *
 * Loaded by emulator-worker.ts via vm_start(). The bios/kernel/drive paths are
 * resolved relative to this file's URL, so all four files live together under
 * /assets/linux/ and are fetched same-origin (the worker's fetch glue in
 * third_party/tinyemu/lib.js). Self-contained: ext2 rootfs on virtio-block
 * (/dev/vda), console on virtio-console (hvc0). No network.
 *
 * The FR-29 host shared folder is added at runtime as an fs0 entry backed by the
 * in-memory 9p device (the guest mounts it with: mount -t 9p host9p /mnt).
 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 128,
    bios: "bbl64.bin",
    kernel: "kernel-riscv64.bin",
    cmdline: "console=hvc0 root=/dev/vda rw",
    drive0: { file: "/assets/linux/riscv64-rootfs/blk.txt" },
    /* FR-29 host shared folder: an in-memory MEMFS dir (/share) the host seeds +
       mirrors. The guest mounts it with:  mount -t 9p host9p /mnt  */
    fs0: { tag: "host9p", file: "/share" },
}
