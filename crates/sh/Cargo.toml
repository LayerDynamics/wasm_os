[package]
name = "sh"
edition.workspace = true
version.workspace = true
license.workspace = true

# The userland shell (L2) — a real wasm32-wasip1 process that drives the
# terminal and runs coreutils via the wasmos_kernel extension (M2, FR-15/16).
[[bin]]
name = "sh"
path = "src/main.rs"

[dependencies]
wasmos-sys = { path = "../wasmos-sys" }
