[package]
name = "spinner"
edition.workspace = true
version.workspace = true
license.workspace = true

# process control and IPC concurrency stress fixture (FR-3): does a little real work (accruing
# scheduler ticks via syscalls for ps/top), then parks on stdin so many can
# coexist without burning CPU. A plain wasm32-wasip1 binary.
[[bin]]
name = "spinner"
path = "src/main.rs"
