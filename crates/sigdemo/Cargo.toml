[package]
name = "sigdemo"
edition.workspace = true
version.workspace = true
license.workspace = true

# M4-T5 signal fixture: blocks in sig_wait (zero CPU) until a SIGTERM arrives,
# then shuts down gracefully — writing a marker file so the E2E can prove the
# process observed and handled the catchable signal (vs an uncatchable SIGKILL).
[[bin]]
name = "sigdemo"
path = "src/main.rs"

[dependencies]
wasmos-sys = { path = "../wasmos-sys" }
