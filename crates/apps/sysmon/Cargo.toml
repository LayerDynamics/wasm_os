[package]
name = "sysmon"
edition.workspace = true
version.workspace = true
license.workspace = true

# Graphical System Monitor (L3 / system monitor, FR-33 + FR-8): a real wasm32-wasip1
# process. It draws a live process table to a canvas surface (wasmgfx) from the
# proc_list syscall and acts on the mouse-selected process via keyboard shortcuts
# or explicit canvas controls — Kill, Terminate, and Raise priority — using a
# delegated Signal capability.
[[bin]]
name = "sysmon"
path = "src/main.rs"

[dependencies]
wasmos-sys = { path = "../../wasmos-sys" }
wasmgfx = { path = "../../wasmgfx" }
