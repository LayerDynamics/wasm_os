[package]
name = "sysmon"
edition.workspace = true
version.workspace = true
license.workspace = true

# Graphical System Monitor (L3 / M4-T8, FR-33 + FR-8): a real wasm32-wasip1
# process. It draws a live process table to a canvas surface (wasmgfx) from the
# proc_list syscall and acts on the selected process via brokered keyboard input —
# kill (SIGTERM/SIGKILL) and renice — using a delegated Signal capability.
[[bin]]
name = "sysmon"
path = "src/main.rs"

[dependencies]
wasmos-sys = { path = "../../wasmos-sys" }
wasmgfx = { path = "../../wasmgfx" }
