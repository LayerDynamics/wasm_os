[package]
name = "coreutils"
edition.workspace = true
version.workspace = true
license.workspace = true

# WASI coreutils (FR-18) — one wasm32-wasip1 binary per utility, plain WASI on
# the WASI process runtime syscall surface + the hierarchical VFS (no wasmos_kernel needed). The
# spine (echo/ls/cat/grep/wc) lands first; the rest fan out in core utilities.

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "grep"
path = "src/bin/grep.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "wc"
path = "src/bin/wc.rs"

[[bin]]
name = "cp"
path = "src/bin/cp.rs"

[[bin]]
name = "mv"
path = "src/bin/mv.rs"

[[bin]]
name = "rm"
path = "src/bin/rm.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "pwd"
path = "src/bin/pwd.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "tail"
path = "src/bin/tail.rs"

[[bin]]
name = "env"
path = "src/bin/env.rs"

# kill — send a signal to a process (signals). Unlike the other coreutils it needs
# the wasmos_kernel `kill` syscall, so it depends on wasmos-sys; the shell
# delegates its Signal capability when spawning it.
[[bin]]
name = "kill"
path = "src/bin/kill.rs"

# renice — change a process's scheduling priority (runtime priority). Like kill it needs the
# wasmos_kernel set_priority syscall + a delegated Signal capability.
[[bin]]
name = "renice"
path = "src/bin/renice.rs"

# ps / top — snapshot the live process table via the proc_list syscall (process-table tools).
# Read-only (no capability needed); ps orders by PID, top by CPU activity.
[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "top"
path = "src/bin/top.rs"

# fetch — brokered networking via the net_request syscall (network broker). Needs a
# delegated Net capability, like kill/renice need Signal.
[[bin]]
name = "fetch"
path = "src/bin/fetch.rs"

[dependencies]
wasmos-sys = { path = "../wasmos-sys" }
