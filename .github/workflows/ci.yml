name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Materialize the git-lfs binaries (vendored v86 runtime + the Linux
          # bzImage under third_party/v86 + assets/linux) the M5 emulator needs.
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-unknown-unknown: the kernel component. wasm32-wasip1: guests.
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - name: Install component tooling
        run: cargo install cargo-component wasm-tools --locked
      - name: Install Zig (FR-14 polyglot guest)
        # Pinned stable release, fetched directly from the official archive with a
        # checksum pin. We do NOT use a setup-zig action: those resolve through
        # community mirrors that don't carry tagged releases (0.14.1 -> 404), then
        # fall back to ziglang.org/builds, which only hosts dev/master builds.
        # echo.zig builds reproducibly here; the polyglot host test byte-diffs it
        # against the Rust echo and the E2E runs it through the real kernel.
        run: |
          set -euo pipefail
          ZIG_VERSION=0.14.1
          ZIG_TARBALL="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          ZIG_SHA256=24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}" -o "$ZIG_TARBALL"
          echo "${ZIG_SHA256}  ${ZIG_TARBALL}" | sha256sum -c -
          tar -xf "$ZIG_TARBALL"
          echo "${GITHUB_WORKSPACE}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Verify Zig is on PATH
        run: zig version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build kernel + regenerate bindings from wit/
        # Bindings are build output (gitignored), regenerated here. This fails if
        # wit/ is invalid or generation breaks. jco glue is not byte-reproducible
        # across CPU arch, so we do NOT byte-diff committed output; correctness is
        # enforced by typecheck (below) + the E2E exercising the fresh bindings.
        run: npm run build
      - name: Typecheck host against fresh bindings
        run: npm run typecheck
      - name: Typecheck + build the React web client (apps/web)
        # The web client (apps/web) is a Vite + React app that boots WASM_OS via the
        # @wasmos/host startDesktop entry. Verify it type-checks and builds for
        # production so it can't silently rot. (At runtime it loads the kernel
        # bindings + workers + guests, served same-origin with COOP/COEP.)
        run: |
          npm run typecheck:web
          npm run build:web
      - name: Clippy (-D warnings, both targets)
        run: npm run lint
      - name: Rust tests
        run: npm run test:rust
      - name: Build guest binaries (Rust wasm32-wasip1 + Zig wasm32-wasi)
        # Real guests the E2E spawns (hello/crash/catfile/sh/coreutils) plus the
        # Zig echo (FR-14). Built BEFORE host tests because the polyglot host test
        # byte-diffs the installed echo.wasm vs echo.zig.wasm. A guest compile
        # failure surfaces here as its own clear step.
        run: npm run build:guests
      - name: Host tests
        run: npm run test:host
      - name: E2E fast lane (M0–M4 + light M5)
        run: npm run test:e2e
      - name: E2E slow lane (boot real Linux in the v86 emulator, M5)
        # A separate lane (multi-second, multi-MB boots) so it can never flake the
        # fast suite. Reuses the webServer the fast lane built.
        run: npm run test:e2e:slow
