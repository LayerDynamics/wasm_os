name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install component tooling
        run: cargo install cargo-component wasm-tools --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build kernel + regenerate bindings from wit/
        run: npm run build
      - name: Binder drift gate — committed bindings must match regenerated
        # `npm run build` rebuilds the kernel from wit/ and re-runs `binder gen`,
        # overwriting packages/abi/generated. If the committed bindings were stale
        # (wit/ or kernel changed without regenerating), git now sees a diff and
        # this fails. This is the SOUND gate: compare against git, not fresh-vs-fresh.
        run: git diff --exit-code -- packages/abi/generated
      - name: Rust tests
        run: npm run test:rust
      - name: Host tests
        run: npm run test:host
      - name: E2E (real browser)
        run: npm run test:e2e
