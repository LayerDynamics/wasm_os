name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install component tooling
        run: cargo install cargo-component wasm-tools --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Binder drift gate — rebuild from wit/ + git-diff committed bindings
        # `npm run drift` = build kernel from wit/ + binder gen (overwrites
        # packages/abi/generated) + `git diff --exit-code`. If the committed
        # bindings were stale (wit/ or kernel changed without regenerating), or
        # if Linux produces different output than the committed (mac) bindings,
        # this fails. SOUND gate: compares against git, not fresh-vs-fresh — and
        # doubles as the cross-platform determinism check.
        run: npm run drift
      - name: Rust tests
        run: npm run test:rust
      - name: Host tests
        run: npm run test:host
      - name: E2E (real browser)
        run: npm run test:e2e
