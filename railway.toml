# Railway config-as-code — schema: https://railway.com/railway.schema.json
#
# WASM_OS deploys as a cross-origin-isolated (COOP/COEP, required for the
# SharedArrayBuffer syscall ring) static app, built entirely from source by the
# multi-stage Dockerfile (kernel, guests, esbuild workers, React SPA, the MIT
# TinyEMU core, and the riscv64 Linux image — no git-LFS materialization needed).
# The server binds Railway's injected $PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node tools/prod-server.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
